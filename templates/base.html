<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}v2.9p Portfolio Dashboard{% endblock %}</title>
    
    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link href="/static/css/style.css" rel="stylesheet">
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Mobile menu overlay -->
    <div class="mobile-overlay" id="mobileOverlay"></div>
    
    <div class="wrapper">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h4><i class="fas fa-chart-line"></i> v2.9p</h4>
                <button class="mobile-close" id="closeSidebar" aria-label="Close menu">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                        <i class="fas fa-home"></i> Portfolio
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('backtest_page') }}" class="nav-link {% if request.endpoint == 'backtest_page' %}active{% endif %}">
                        <i class="fas fa-chart-line"></i> Backtest
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('settings_page') }}" class="nav-link {% if request.endpoint == 'settings_page' %}active{% endif %}">
                        <i class="fas fa-sliders-h"></i> Settings
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <header class="topbar">
                <div class="container-fluid">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-2">
                            <button class="mobile-menu-btn" id="openSidebar" aria-label="Open menu">
                                <i class="fas fa-bars"></i>
                            </button>
                            <h2 class="topbar-title">{% block page_title %}Portfolio Dashboard{% endblock %}</h2>
                        </div>
                        <div class="topbar-meta d-flex align-items-center gap-3">
                            <span id="topbar-profile" style="font-size:0.72rem;color:#64748b;white-space:nowrap;"
                                  title="Active profile"></span>
                            <span class="text-muted" id="last-updated">Last updated: Just now</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <div id="chartTooltip" class="chart-tooltip"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
    // Mobile menu toggle
    (function() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobileOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');
        
        function openMenu() {
            sidebar.classList.add('open');
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        function closeMenu() {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
            document.body.style.overflow = '';
        }
        
        openBtn.addEventListener('click', openMenu);
        closeBtn.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);
        
        // Close on nav link click (mobile)
        sidebar.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 992) closeMenu();
            });
        });
    })();

    // Show active profile name in topbar
    (function() {
        const el = document.getElementById('topbar-profile');
        if (!el) return;
        fetch('/api/profiles/active')
            .then(r => r.json())
            .then(p => { if (p && p.name) el.textContent = '\u25CF ' + p.name; })
            .catch(() => {});
    })();
    </script>
    {% block scripts %}{% endblock %}
</html>
