<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}v2.9p Portfolio Dashboard{% endblock %}</title>
    
    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link href="/static/css/style.css" rel="stylesheet">
    
    {% block head %}{% endblock %}
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h4><i class="fas fa-chart-line"></i> v2.9p</h4>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                        <i class="fas fa-home"></i> Portfolio
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('backtest_page') }}" class="nav-link {% if request.endpoint == 'backtest_page' %}active{% endif %}">
                        <i class="fas fa-chart-line"></i> Backtest
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <header class="topbar">
                <div class="container-fluid">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2>{% block page_title %}Portfolio Dashboard{% endblock %}</h2>
                        <div>
                            <span class="text-muted" id="last-updated">Last updated: Just now</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <div id="chartTooltip" class="chart-tooltip"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    
    {% block scripts %}{% endblock %}
</html>
